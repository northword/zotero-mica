<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<vbox
  id="__addonRef__"
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <groupbox>
    <label><html:h2 data-l10n-id="section-material" /></label>

    <!-- Enabled -->
    <checkbox
      data-l10n-id="enabled"
      preference="enabled"
      native="true"
    />

    <!-- Material type -->
    <label data-l10n-id="material-label" />
    <radiogroup id="mica-material" preference="material">
      <radio value="mica" data-l10n-id="material-mica" />
      <radio value="mica-alt" data-l10n-id="material-mica-alt" />
      <radio value="acrylic" data-l10n-id="material-acrylic" />
    </radiogroup>

    <!-- Tint opacity -->
    <hbox align="center">
      <label data-l10n-id="tint-opacity" />
      <html:input
        id="mica-tint-opacity"
        type="range"
        min="0"
        max="100"
        step="5"
        preference="tint-opacity"
      />
      <description
        id="mica-tint-opacity-value"
        class="mica-pref-description"
      />
    </hbox>
    <description
      data-l10n-id="tint-opacity-description"
      class="mica-pref-description"
    />

    <!-- Dialogs -->
    <checkbox
      data-l10n-id="apply-dialogs"
      preference="apply-dialogs"
      native="true"
    />
    <description
      data-l10n-id="apply-dialogs-description"
      class="mica-pref-description"
    />

    <!-- Win10 fallback -->
    <checkbox
      data-l10n-id="fallback-win10"
      preference="fallback-win10"
      native="true"
    />
    <description
      data-l10n-id="fallback-win10-description"
      class="mica-pref-description"
    />

    <!-- PDF page background -->
    <checkbox
      data-l10n-id="pdf-background"
      preference="pdf-background"
      native="true"
    />
    <description
      data-l10n-id="pdf-background-description"
      class="mica-pref-description"
    />

    <!-- Status -->
    <description id="mica-status" class="mica-pref-description" />
  </groupbox>
</vbox>
